name: Release binaries

on:
  push:
    branches:
      - main
      - 'ci/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build; empty uses the selected ref
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'
          cache: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          versioned_name="fofa-${GOOS}-${GOARCH}"
          binary_name="${versioned_name}"
          if [[ "${GOOS}" == "windows" ]]; then
            binary_name="${binary_name}.exe"
          fi
          mkdir -p package dist
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o "package/${binary_name}" ./cmd/fofa
          cp README.md LICENSE package/
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd package && zip -q -r "../dist/${versioned_name}.zip" .)
          else
            tar -C package -czf "dist/${versioned_name}.tar.gz" .
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: fofa-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
